name: Crear exe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Quitar la lista local de códigos si usas el servidor de canje
        shell: bash
        run: node -e "const c=require('./config.json');if(c.codes&&c.codes.url){require('fs').rmSync('src/codes.json',{force:true});console.log('codes.json eliminado del instalador')}"
      - name: Instalar dependencias
        shell: bash
        run: npm install --ignore-scripts
      - name: Descargar Electron (con reintentos)
        shell: bash
        run: |
          for i in 1 2 3 4 5; do
            if node node_modules/electron/install.js; then exit 0; fi
            echo "Intento $i falló, reintentando..."; sleep 30
          done
          exit 1
      - name: Subir el número de versión
        shell: bash
        run: npm version "6.0.${{ github.run_number }}" --no-git-tag-version
      - name: Crear instalador y publicarlo (con reintentos)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3; do
            if npx electron-builder --win nsis --publish always -c.publish.provider=github -c.publish.owner=${{ github.repository_owner }} -c.publish.repo=${{ github.event.repository.name }} -c.publish.releaseType=release; then exit 0; fi
            echo "Intento $i falló, reintentando..."; sleep 30
          done
          exit 1
      - name: Huella SHA-256 del instalador
        shell: pwsh
        run: |
          Get-ChildItem dist/*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$($_.Name)  SHA-256: $h" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
      - uses: actions/upload-artifact@v4
        with:
          name: SarexStudioLauncher-instalador
          path: dist/*.exe
